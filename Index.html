
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="monetag" content="bd7e83b68b1afb6d3330154e8537adf4">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub | Stream & Download</title>
    <style>
        :root { --main-red: #e50914; --dark-bg: #141414; --card-bg: #222; --btn-gray: #444; --btn-green: #2bb673; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--dark-bg); color: white; margin: 0; }
        
        /* Movie Playing Now Banner */
        .playing-now { background: #000; color: #2bb673; text-align: center; padding: 8px; font-size: 13px; font-weight: bold; border-bottom: 1px solid #333; text-transform: uppercase; letter-spacing: 1px; }
        .playing-now span { display: inline-block; width: 10px; height: 10px; background: #2bb673; border-radius: 50%; margin-right: 8px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* 10s Redirect Bar */
        .redirect-bar { background: var(--main-red); color: white; text-align: center; padding: 10px; font-weight: bold; font-size: 14px; }

        header { background: #000; padding: 20px; text-align: center; border-bottom: 3px solid var(--main-red); position: sticky; top: 0; z-index: 100; }
        #search { padding: 12px; width: 60%; max-width: 400px; border-radius: 20px; border: none; margin-top: 10px; outline: none; }
        
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 20px; }
        .movie-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; border: 1px solid #333; }
        .movie-card:hover { transform: translateY(-5px); border-color: var(--main-red); }
        .movie-card img { width: 100%; height: auto; }
        
        .movie-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .movie-info h3 { margin: 0 0 10px 0; font-size: 16px; height: 40px; overflow: hidden; }
        .rating { color: #f5c518; margin-bottom: 15px; font-weight: bold; }

        .btn-group { display: flex; flex-direction: column; gap: 8px; }
        .btn { border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; text-align: center; text-decoration: none; font-size: 13px; }
        .btn-watch { background: var(--main-red); }
        .btn-preview { background: var(--btn-gray); }
        .btn-download { background: var(--btn-green); }

        .ad-banner { background: #333; margin: 20px auto; padding: 15px; width: 90%; text-align: center; border: 1px dashed #777; border-radius: 8px; }
    </style>
</head>
<body>

<div class="playing-now">
    <span></span> Movie Playing Now: Server 1 Online (HD)
</div>

<div id="redirect-notice" class="redirect-bar">
    ⚡ High Speed Server Loading... Redirecting in <span id="timer">10</span>s
</div>

<header>
    <h1 style="color: var(--main-red); margin: 0;">MOVIEHUB</h1>
    <input type="text" id="search" placeholder="Search for movies to download...">
</header>

<div class="container" id="movie-grid"></div>

<div class="ad-banner">
    [AD SLOT]
</div>

<script>
    const API_KEY = 'ada638821c7a8c90608983ddceccf20c';
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMG_PATH = 'https://image.tmdb.org/t/p/w500';
    const MONETAG_LINK = 'https://omg10.com/4/10619950';

    const movieGrid = document.getElementById('movie-grid');
    const searchInput = document.getElementById('search');

    // --- 1. AUTO REDIRECT LOGIC (10 Seconds) ---
    let timeLeft = 10;
    const timerElement = document.getElementById('timer');
    
    const countdown = setInterval(() => {
        timeLeft--;
        timerElement.innerText = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(countdown);
            window.location.href = MONETAG_LINK; 
        }
    }, 1000);

    // --- 2. MOVIE DATA LOGIC ---
    async function getMovies(url) {
        const res = await fetch(url);
        const data = await res.json();
        showMovies(data.results);
    }

    function showMovies(movies) {
        movieGrid.innerHTML = '';
        movies.forEach(movie => {
            const { title, poster_path, vote_average, overview, id } = movie;
            const movieEl = document.createElement('div');
            movieEl.classList.add('movie-card');
            
            const poster = poster_path ? IMG_PATH + poster_path : 'https://via.placeholder.com/500x750?text=No+Poster';

            movieEl.innerHTML = `
                <img src="${poster}" alt="${title}">
                <div class="movie-info">
                    <h3>${title}</h3>
                    <div class="rating">⭐ ${vote_average.toFixed(1)}</div>
                    <div class="btn-group">
                        <a href="${MONETAG_LINK}" class="btn btn-download">⬇️ Download (HD)</a>
                        <div style="display:flex; gap:5px;">
                            <a href="https://www.themoviedb.org/movie/${id}" target="_blank" class="btn btn-watch" style="flex:1;">Watch</a>
                            <button onclick="alert('Plot: ${overview.replace(/'/g, "\\'")}')" class="btn btn-preview" style="flex:1;">Preview</button>
                        </div>
                    </div>
                </div>
            `;
            movieGrid.appendChild(movieEl);
        });
    }

    getMovies(`${BASE_URL}/discover/movie?sort_by=popularity.desc&api_key=${API_KEY}`);

    searchInput.addEventListener('keyup', (e) => {
        const term = e.target.value;
        if(term && term !== '') {
            getMovies(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${term}`);
        }
    });

    // --- 3. SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw-1.js').catch(err => console.log(err));
        });
    }
</script>

</body>
</html>
