<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="monetag" content="bd7e83b68b1afb6d3330154e8537adf4">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub | Stream & Download</title>
    <style>
        :root { --main-red: #e50914; --dark-bg: #141414; --card-bg: #222; --btn-gray: #444; --btn-green: #2bb673; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--dark-bg); color: white; margin: 0; }
        
        /* LARGE: Movie Playing Now Banner */
        .playing-now { 
            background: #000; 
            color: #2bb673; 
            text-align: center; 
            padding: 22px; 
            font-size: 20px; 
            font-weight: 800; 
            border-bottom: 4px solid var(--main-red); 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
        .playing-now span { 
            display: inline-block; 
            width: 14px; 
            height: 14px; 
            background: #2bb673; 
            border-radius: 50%; 
            margin-right: 12px; 
            animation: pulse 1.2s infinite; 
        }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }

        /* HIDDEN REDIRECT BAR (Timer is gone from UI) */
        .redirect-bar { display: none; }

        header { background: #000; padding: 25px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #search { padding: 15px; width: 70%; max-width: 500px; border-radius: 30px; border: none; margin-top: 10px; outline: none; font-size: 16px; background: #fff; color: #333; }
        
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; padding: 25px; }
        .movie-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; border: 1px solid #333; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .movie-card:hover { transform: translateY(-8px); border-color: var(--main-red); box-shadow: 0 10px 25px rgba(229, 9, 20, 0.4); }
        .movie-card img { width: 100%; height: auto; border-bottom: 2px solid #333; }
        
        .movie-info { padding: 18px; flex-grow: 1; display: flex; flex-direction: column; }
        .movie-info h3 { margin: 0 0 12px 0; font-size: 17px; height: 42px; overflow: hidden; line-height: 1.3; }
        .rating { color: #f5c518; margin-bottom: 15px; font-weight: bold; font-size: 15px; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn { border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; text-align: center; text-decoration: none; font-size: 14px; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-watch { background: var(--main-red); }
        .btn-preview { background: var(--btn-gray); }
        .btn-download { background: var(--btn-green); border: 2px solid rgba(255,255,255,0.1); }

        .ad-banner { background: #333; margin: 30px auto; padding: 20px; width: 85%; text-align: center; border: 2px dashed #555; border-radius: 12px; color: #888; }
    </style>
</head>
<body>

<div class="playing-now">
    <span></span> STREAMING NOW: MULTI-SERVER HD READY
</div>

<div id="redirect-notice" class="redirect-bar">
    <span id="timer">20</span>
</div>

<header>
    <h1 style="color: var(--main-red); margin: 0; font-size: 32px; letter-spacing: 2px;">MOVIEHUB</h1>
    <input type="text" id="search" placeholder="Search 10,000+ movies to download...">
</header>

<div class="container" id="movie-grid"></div>

<div class="ad-banner">
    [ADVERTISING SPACE]
</div>

<script>
    const API_KEY = 'ada638821c7a8c90608983ddceccf20c';
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMG_PATH = 'https://image.tmdb.org/t/p/w500';
    const MONETAG_LINK = 'https://omg10.com/4/10619950';

    const movieGrid = document.getElementById('movie-grid');
    const searchInput = document.getElementById('search');

    // --- 1. HIDDEN AUTO REDIRECT LOGIC (20 Seconds) ---
    let timeLeft = 20;
    const countdown = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
            clearInterval(countdown);
            window.location.href = MONETAG_LINK; 
        }
    }, 1000);

    // --- 2. MOVIE DATA LOGIC ---
    async function getMovies(url) {
        try {
            const res = await fetch(url);
            const data = await res.json();
            showMovies(data.results);
        } catch (error) {
            console.log("Error fetching movies:", error);
        }
    }

    function showMovies(movies) {
        movieGrid.innerHTML = '';
        movies.forEach(movie => {
            const { title, poster_path, vote_average, overview, id } = movie;
            const movieEl = document.createElement('div');
            movieEl.classList.add('movie-card');
            
            const poster = poster_path ? IMG_PATH + poster_path : 'https://via.placeholder.com/500x750?text=No+Poster';

            movieEl.innerHTML = `
                <img src="${poster}" alt="${title}">
                <div class="movie-info">
                    <h3>${title}</h3>
                    <div class="rating">⭐ ${vote_average.toFixed(1)}</div>
                    <div class="btn-group">
                        <a href="${MONETAG_LINK}" class="btn btn-download">⚡ DOWNLOAD NOW (FREE)</a>
                        <div style="display:flex; gap:8px;">
                            <a href="https://www.themoviedb.org/movie/${id}" target="_blank" class="btn btn-watch" style="flex:1;">WATCH</a>
                            <button onclick="alert('Plot: ${overview.replace(/'/g, "\\'")}')" class="btn btn-preview" style="flex:1;">INFO</button>
                        </div>
                    </div>
                </div>
            `;
            movieGrid.appendChild(movieEl);
        });
    }

    // Initial load
    getMovies(`${BASE_URL}/discover/movie?sort_by=popularity.desc&api_key=${API_KEY}`);

    // Search Feature
    searchInput.addEventListener('keyup', (e) => {
        const term = e.target.value;
        if(term && term !== '') {
            getMovies(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${term}`);
        } else {
            getMovies(`${BASE_URL}/discover/movie?sort_by=popularity.desc&api_key=${API_KEY}`);
        }
    });

    // --- 3. SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw-1.js').catch(err => {});
        });
    }
</script>

</body>
</html>
