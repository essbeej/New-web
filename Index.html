<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub | Stream Info & Reviews</title>
    <style>
        :root { --main-red: #e50914; --dark-bg: #141414; --card-bg: #222; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--dark-bg); color: white; margin: 0; }
        
        header { background: #000; padding: 20px; text-align: center; border-bottom: 3px solid var(--main-red); position: sticky; top: 0; z-index: 100; }
        .search-container { margin-top: 15px; }
        #search { padding: 10px; width: 60%; max-width: 400px; border-radius: 20px; border: none; outline: none; }
        
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; padding: 20px; }
        .movie-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; transition: 0.3s; cursor: pointer; position: relative; }
        .movie-card:hover { transform: translateY(-10px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .movie-card img { width: 100%; height: auto; display: block; }
        .movie-info { padding: 12px; font-size: 14px; }
        .movie-info h3 { margin: 0 0 8px 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rating { color: #f5c518; font-weight: bold; display: flex; align-items: center; gap: 5px; }

        .ad-banner { background: #333; margin: 15px auto; padding: 10px; width: 90%; text-align: center; border: 1px dashed #777; color: #aaa; }
    </style>
</head>
<body>

<header>
    <h1 style="color: var(--main-red); margin: 0;">MOVIEHUB</h1>
    <div class="search-container">
        <input type="text" id="search" placeholder="Search for a movie...">
    </div>
</header>

<div class="ad-banner">
    [AD SPACE: Paste your Banner Script here]
</div>

<div class="container" id="movie-grid"></div>

<div class="ad-banner">
    [AD SPACE: Footer Ad]
</div>

<script>
    const API_KEY = 'ada638821c7a8c90608983ddceccf20c';
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMG_PATH = 'https://image.tmdb.org/t/p/w500';

    const movieGrid = document.getElementById('movie-grid');
    const searchInput = document.getElementById('search');

    getMovies(`${BASE_URL}/discover/movie?sort_by=popularity.desc&api_key=${API_KEY}`);

    async function getMovies(url) {
        const res = await fetch(url);
        const data = await res.json();
        showMovies(data.results);
    }

    function showMovies(movies) {
        movieGrid.innerHTML = '';
        movies.forEach(movie => {
            const { title, poster_path, vote_average, overview } = movie;
            const movieEl = document.createElement('div');
            movieEl.classList.add('movie-card');
            
            const poster = poster_path ? IMG_PATH + poster_path : 'https://via.placeholder.com/500x750?text=No+Poster';

            movieEl.innerHTML = `
                <img src="${poster}" alt="${title}">
                <div class="movie-info">
                    <h3>${title}</h3>
                    <div class="rating">⭐ ${vote_average.toFixed(1)}</div>
                </div>
            `;
            
            movieEl.onclick = () => alert(`Plot: ${overview}`);
            movieGrid.appendChild(movieEl);
        });
    }

    searchInput.addEventListener('keyup', (e) => {
        const term = e.target.value;
        if(term && term !== '') {
            getMovies(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${term}`);
        } else {
            getMovies(`${BASE_URL}/discover/movie?sort_by=popularity.desc&api_key=${API_KEY}`);
        }
    });

    // ✅ REGISTER SERVICE WORKER (THIS IS THE KEY PART)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw-1.js')
        .then(() => console.log('Service Worker Registered'))
        .catch(err => console.log('Service Worker Failed:', err));
    }
</script>

</body>
</html>
